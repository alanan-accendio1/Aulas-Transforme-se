<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>
    <style>
      table,
      td {
        border: 1px solid black;
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <!-- Estrutura da Tabela -->
    <!-- 
        TABLE
            TR - Table row (linha horizontal)
                TH - Table Header (tirulo em cada coluna)
                TD - Table data (conteúdo)
    -->
    <table>
      <!-- Primeira linha -->
      <tr>
        <th>Produtos</th>
        <th>Preço</th>
      </tr>

      <!-- Segunda linha -->
      <tr>
        <td>Café</td>
        <td>R$ 19,00</td>
      </tr>

      <!-- Terceira linha -->
      <tr>
        <td>Arroz</td>
        <td>R$ 24,99</td>
      </tr>
    </table>
  </body>
</html>
