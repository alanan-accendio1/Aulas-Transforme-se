<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 02 - CSS</title>

    <!-- Usando estilos dentro do HTML -->
    <style>
      body {
        /* background-color para cor de fundo */
        background-color: rgb(63, 63, 151);
      }
      h1 {
        /* Color é para cor de texto */
        color: brown;
        text-align: center;
        background-color: antiquewhite;
      }
    </style>
  </head>
  <body>
    <h1>Trabalhando com CSS</h1>
    <h1>Titulo 2</h1>
    <p style="color: aqua; background-color: #000">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Consequuntur
      quia, laudantium consequatur sunt perferendis quaerat possimus aperiam at
      earum velit nulla eos nemo nihil cupiditate distinctio itaque voluptatem
      voluptates! Iusto?
    </p>
  </body>
</html>
