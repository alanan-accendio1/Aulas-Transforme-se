    <title>Flex - Justify-content</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>justify-content: center</h2>
    <div class="container center">
      <div id="div1"></div>

      <div id="div4"></div>

    <h2>justify-content: left</h2>

      <div id="div1"></div>
      <div id="div2"></div>
      <div id="div3"></div>
      <div id="div4"></div>

      <div id="div2"></div>
      <div id="div3"></div>

      <div id="div4"></div>

      <div id="div2"></div>
      <div id="div3"></div>
      <div id="div4"></div>

      <div id="div3"></div>
      <div id="div4"></div>

      <div id="div1"></div>
      <div id="div2"></div>
      <div id="div3"></div>
      <div id="div4"></div>

      <div id="div1"></div>
      <div id="div2"></div>
      <div id="div4"></div>
    </div>
